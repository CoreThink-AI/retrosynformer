[project]
name = "retrosynformer"
version = "0.1.2"
description = "RetroSynFormer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic",
    "annotated-types",
    "apted",
    "black",
    "boto3",
    "botocore",
    "bottle",
    "brotli",
    "cachedmethods",
    "certifi",
    "cython",
    "cycler",
    "contourpy",
    "pydantic",
    "dask",
    "dill",
    "numpy",
    "optuna",
    "pandas",
    "partd",
    "rdkit",
    "reaction-utils==1.9.3",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "markupsafe",
    "huggingface-hub",
    "filelock",
    "sympy==1.13.1",
    "transformers",
    "torch>=2.12.0",
]

[project.optional-dependencies]
# AMD ROCm GPU (Radeon / Strix Halo iGPU):
#   uv sync --extra amdgpu
#   pip install retrosynformer[amdgpu] --extra-index-url https://download.pytorch.org/whl/rocm6.2
amdgpu = [
    "torch>=2.12.0",
]

# Development / testing:  uv sync --extra dev
dev = [
    "pytest>=8",
]

# uv resolves torch from the ROCm index when the amdgpu extra is active
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm", extra = "amdgpu" },
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
