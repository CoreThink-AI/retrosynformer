[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrosynformer"
version = "0.1.6"
description = "RetroSynFormer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic",
    "annotated-types",
    "apted",
    "black",
    "boto3",
    "botocore",
    "bottle",
    "brotli",
    "cachedmethods",
    "certifi",
    "cython",
    "cycler",
    "contourpy",
    "pydantic",
    "dask",
    "dill",
    "numpy",
    "optuna",
    "pandas",
    "partd",
    "rdkit",
    "rdchiral @ git+https://github.com/CoreThink-AI/rdchiral",
    "reaction-utils==1.9.3",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "markupsafe",
    "huggingface-hub",
    "filelock",
    # "sympy>=1.13.3",
    "transformers",
]

[project.optional-dependencies]
# CPU-only PyTorch:  uv sync --extra cpu
cpu = [
    "torch>=2.0.0",
]

# AMD ROCm GPU (Radeon / Strix Halo iGPU):
#   uv sync --extra rocm
#   uv sync --extra amdgpu  (alias)
rocm = [
    "torch>=2.0.0",
    "sympy==1.13.1",
]
amdgpu = [
    "torch>=2.0.0",
    "sympy==1.13.1",
]

# Development / testing:  uv sync --extra dev
dev = [
    "pytest>=8",
]

[project.scripts]
retrosynformer-train             = "retrosynformer.scripts.train:main"
retrosynformer-hypertune         = "retrosynformer.scripts.hypertune:main"
retrosynformer-show-study        = "retrosynformer.scripts.show_study:main"
retrosynformer-show-all-studies  = "retrosynformer.scripts.show_all_studies:main"
retrosynformer-monitor-jsonl     = "retrosynformer.scripts.monitor_jsonl:main"
retrosynformer-monitor-progress  = "retrosynformer.scripts.monitor_progress:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
script-files = [
    "scripts/monitor_train_progress.sh",
    "scripts/train_structured_dropout_comparison.sh",
]

# uv resolves torch from the ROCm index when the rocm or amdgpu extra is active,
# and from the CPU index when the cpu extra is active.
[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
rdchiral = { path = "../rdchiral", editable = true }
torch = [
    { index = "pytorch-rocm", extra = "rocm" },
    { index = "pytorch-rocm", extra = "amdgpu" },
    { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
