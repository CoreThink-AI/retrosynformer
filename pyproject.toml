[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retrosynformer"
version = "0.1.9"
description = "RetroSynFormer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic",
    "annotated-types",
    "apted",
    "black",
    "boto3",
    "botocore",
    "bottle",
    "brotli",
    "cachedmethods",
    "certifi",
    "cython",
    "cycler",
    "contourpy",
    "pydantic",
    "dask",
    "dill",
    "numpy",
    "optuna",
    "pandas",
    "partd",
    "rdkit",
    "rdchiral @ git+https://github.com/CoreThink-AI/rdchiral",
    "reaction-utils==1.9.3",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "markupsafe",
    "huggingface-hub",
    "filelock",
    # "sympy>=1.13.3",
    "transformers",
]

[project.optional-dependencies]
# CPU-only PyTorch:  uv sync --extra cpu
cpu = [
    "torch>=2.0.0,<2.7.0",
]

# AMD ROCm GPU (Radeon / Strix Halo iGPU):
#   uv sync --extra rocm
# Pinned to torch 2.5.1+rocm6.2 — verified working on taco (Ubuntu 25.10,
# kernel 6.17, Strix Halo iGPU). DO NOT upgrade to rocm6.4 or torch>=2.6 —
# rocm6.4/torch>=2.7.0 crashes taco's Strix Halo iGPU.
rocm = [
    "torch>=2.5.0,<2.6.0",
    "pytorch-triton-rocm>=3.1.0",
    "sympy==1.13.1",
]

# Inference REST API:  uv sync --extra serve
serve = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

# Training dashboard (Flask-Admin):  uv sync --extra dashboard
dashboard = [
    "flask>=3.0,<4",
    "flask-admin>=2.0,<3",
    "flask-sqlalchemy>=3.1,<4",
    "flask-limiter>=3.5,<4",
    "wtforms>=3.1,<4",
]

# NVIDIA CUDA GPU:  uv sync --extra cuda
cuda = [
    "torch>=2.0.0",
]

# Development / testing:  uv sync --extra dev
dev = [
    "pytest>=8",
    "httpx>=0.27",   # required by FastAPI TestClient
]

[project.scripts]
rs-train             = "retrosynformer.scripts.train:main"
rs-hypertune         = "retrosynformer.scripts.hypertune:main"
rs-show-study        = "retrosynformer.scripts.show_study:main"
rs-show-all-studies  = "retrosynformer.scripts.show_all_studies:main"
rs-monitor-jsonl     = "retrosynformer.scripts.monitor_jsonl:main"
rs-monitor-progress  = "retrosynformer.scripts.monitor_progress:main"
rs-plot-learning-curves = "retrosynformer.scripts.plot_learning_curves:main"
rs-sync-results         = "retrosynformer.scripts.sync_results:main"
rs-mark-stopped         = "retrosynformer.scripts.mark_stopped:main"
rs-serve                = "retrosynformer.scripts.serve:main"
rs-status               = "retrosynformer.scripts.status:main"
rs-dashboard            = "retrosynformer.scripts.dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]


# Declare torch extras as mutually exclusive so uv doesn't try to resolve
# pytorch-cpu and pytorch-rocm indexes simultaneously.
[tool.uv]
# reaction-utils==1.9.3 declares rdkit<2024.0.0 but is runtime-compatible
# with newer rdkit; override so we can use the current release.
# pytorch-triton-rocm: torch==2.5.1+rocm6.2 declares ==3.1.0 but 3.1.0 is
# not available as a standalone wheel; relax to >=3.1.0 so uv can resolve
# with the 3.2.0 that IS in the rocm6.2 index. taco's venv already has the
# bundled 3.1.0 so no upgrade occurs there.
override-dependencies = [
    "rdkit>=2025.3.1",
    "pytorch-triton-rocm>=3.1.0",
]
# Declare torch extras as mutually exclusive so uv doesn't try to resolve
# pytorch-cpu and pytorch-rocm indexes simultaneously.
conflicts = [
  [
    { extra = "cpu" },
    { extra = "rocm" },
    { extra = "cuda" },
  ],
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # rdkit 2023.9.x emits DeprecationWarnings from its own internal Python shims
    # (MolStandardize submodules) — not from our code; suppress until rdkit is
    # upgradeable past the reaction-utils==1.9.3 rdkit<2024.0.0 upper bound.
    "ignore::DeprecationWarning:rdkit",
    # rxnutils uses Pydantic v1 update_forward_refs() API with Pydantic v2 installed.
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    # starlette TestClient / httpx compatibility shim — not our code.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.uv.sources]
rdchiral = { path = "../rdchiral", editable = true }
torch = [
    { index = "pytorch-rocm", extra = "rocm" },
    { index = "pytorch-cpu", extra = "cpu" },
]
pytorch-triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
