default:
  image: python:3.12-slim

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

cache:
  key: uv-$CI_COMMIT_REF_SLUG
  paths:
    - .uv-cache/

stages:
  - test

test:doctests:
  stage: test
  before_script:
    - pip install uv --quiet
    - uv sync --frozen
  script:
    - uv run --with pytest pytest tests/ -v
