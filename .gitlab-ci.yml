default:
  image: python:3.12-slim

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"

cache:
  key: uv-$CI_COMMIT_REF_SLUG
  paths:
    - .uv-cache/

stages:
  - test

test:
  stage: test
  before_script:
    - pip install uv --quiet
    - uv sync --frozen --extra cpu --extra dev
  script:
    - |
      uv run pytest tests/ -v \
        --cov=src/retrosynformer \
        --cov-report=term-missing \
        --cov-report=html:docs/coverage_html \
        --cov-report=xml:coverage.xml \
        --cov-report=json:coverage.json
    - |
      python - <<'EOF'
      import json, sys
      with open("coverage.json") as f:
          cov = json.load(f)
      t = cov["totals"]
      pct = round(t["percent_covered"], 1)
      print(f"Coverage: {pct}%  ({t['covered_lines']}/{t['num_statements']} statements)")
      if pct < 15:
          print("WARNING: coverage below 15%")
          sys.exit(1)
      EOF
  # GitLab parses this regex from stdout to display a coverage badge on the pipeline.
  coverage: '/Coverage:\s+(\d+\.?\d*)%/'
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - docs/coverage_html/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
