# Baseline config for the large PaRoutes dataset.
#
# Paper: Granqvist et al., RetroSynFormer, Digital Discovery 2026, 5, 348-362
#        DOI: 10.1039/d5dd00153f
#
# Target result (Table 6, large dataset, beam_width=50):
#   N1 success rate: 0.929   N5 success rate: 0.887
#   N1 top-1 accuracy: 0.082  N5 top-1 accuracy: 0.045
#   N1 TED: 6.168            N5 TED: 7.540
#   N1 avg route length: 2.276  N5 avg route length: 2.531
#
# Large dataset stats (paper Table 1):
#   Templates: 2986   Building blocks: 72,737
#   Training routes: 86,048   Valid: 10,645   N1 test: 5,631   N5 test: 5,260
#
# Architecture: GPT-2 Decision Transformer (Section 3.3).
# SI Table S1 gives Optuna-optimal hyperparameters for the standard dataset model:
#   hidden_size=256, n_heads=4, n_layers=26, attn_pdrop=0.02, embd_pdrop=0.2,
#   resid_pdrop=0.08, activation_function=relu, action_tanh=false, n_epochs=300.
# The paper uses the same Optuna procedure for all three datasets; no separate
# large-specific Optuna table is published.  Large dataset internal studies
# (baseline_large_emma.yaml) searched n_heads=[4,5,6] and n_layers=[12,16,21,26],
# finding that 19-26 layers consistently outperform fewer layers.  The best
# trial used n_heads=5, head_dim=128 (hidden_size=640), lr≈9.685e-4.
#
# Usage:
#   python -m retrosynformer.runner -c results/config/baseline_large.yaml
#   rs-train -c results/config/baseline_large.yaml

context:
  building_blocks: data/large_building_blocks.csv
  random_state: 1
  templates_path: data/large_reaction_templates.pickle

dataset:
  action_dim: 2986          # paper Table 1: small=588, standard=1572, large=2986
  drop_duplicates: true
  fp_dim: 1024              # paper Section 3.3.2: 1024-bit Morgan radius-2 fingerprints
  n_in_state: 2             # paper Section 3.3.2: two molecules concatenated → state_dim=2048
  routes_path: data/large_routes.json
  shuffle: true
  synthetic_routes_path: false
  valid_set: n1+n5          # paper Section 3.2: N1+N5 benchmark targets are the held-out test set

evaluation:
  batch_size: 64
  beam_width: 50            # paper "RetroSynFormer50"; use beam_width=1 for fast sanity checks
  eval_n_batches: 10
  eval_routes_frequency: 100
  max_depth: 6              # paper Section 3.7
  test_frac: 0.1
  sort_on: trajectory_prob  # trajectory_prob | total_reward
  ted_exhaustive_limit: 64
  # Prune beam branches that would revisit a molecule already decomposed in the same
  # branch (cyclic routes are provably unsolvable and waste beam capacity).
  # Set to false to reproduce pre-v0.1.42 behaviour or to measure the impact.
  prevent_cyclic_routes: true

model:
  action_tanh: false        # SI Table S1: optimal=false (discrete one-hot template selection)
  activation_function: relu # SI Table S1: optimal=relu
  attn_pdrop: 0.02          # SI Table S1: standard optimal=0.02; large study also used 0.02 as baseline
  embd_pdrop: 0.2           # SI Table S1: standard optimal=0.2
  head_dim: 128             # not in SI Table S1 (paper specifies hidden_size=256 directly);
                            # large study best trial used head_dim=128 with n_heads=5 (hidden_size=640)
  max_ep_len: 20
  n_heads: 4                # SI Table S1: standard optimal=4; large study searched [4, 5, 6]
  n_layers: 26              # SI Table S1: standard optimal=26; large studies confirm 19-26 > fewer layers
  resid_pdrop: 0.08         # SI Table S1: standard optimal=0.08
  use_structured_dropout: false

  # --- Residual dropout mask tying (layer_shared_resid_dropout) ---
  # Ties residual dropout Bernoulli masks between dropout sites so the same
  # hidden units are suppressed at multiple points per forward pass.
  #
  # List/bool — intra-layer: ties attn and MLP residual dropout within each block.
  #   layer_shared_resid_dropout: true          # all layers
  #   layer_shared_resid_dropout: [1,1,0,0,...] # per-layer; 1=tied, 0=independent
  #
  # Dict with integer keys (1-based) — sparse intra-layer:
  #   layer_shared_resid_dropout: {1: 1, 3: 1}  # tie layers 1 and 3 only
  #
  # Dict with float N.5 keys — inter-layer: ties block N mlp.dropout to
  # block N+1 attn.resid_dropout; boundaries sharing a group-ID share one mask.
  #   layer_shared_resid_dropout: {1.5: 1}            # one boundary
  #   layer_shared_resid_dropout: {1.5: 1, 2.5: 1}    # one mask spans three layers
  #
  # Mixed dict — both intra- and inter-layer simultaneously:
  #   layer_shared_resid_dropout: {1: 1, 1.5: 1}
  #
  # See src/retrosynformer/dropout.py:apply_shared_resid_dropout.
  # layer_shared_resid_dropout: ~

optimizer:
  lr: 0.001                 # not in SI Table S1; large study best trial lr≈9.685e-4; ~0.001
  momentum: 0.98

reward:
  # Default reward — highest success rate across all variants tested (paper Table 5, Table S2).
  # reward = factor * (scale_with_depth ^ depth)  when scale_with_depth > 0
  #        = factor                               otherwise
  building_block_reward_factor: 0     # SI Table S2: optimal=0
  building_block_scale_with_depth: 2  # SI Table S2: optimal=2
  dead_end_reward_factor: -2          # SI Table S2: optimal=-2
  dead_end_scale_with_depth: 2        # SI Table S2: optimal=2
  intermediate_reward_factor: -2      # SI Table S2: optimal=-2
  intermediate_scale_with_depth: 1    # SI Table S2: optimal=1

train:
  batch_size: 128           # large study used 128; standard dataset uses 64
  loss: crossEntropyLoss
  n_epochs: 300             # SI Table S1: 300 epochs
  early_stopping_patience: 30
  lr_scheduler_patience: 15
  results_path: results/
