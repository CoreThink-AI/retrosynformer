# Hyperparameter search for layer-shared residual dropout on the small dataset.
#
# Architecture is fixed at the best-performing trial from standard-v2-dropout-details
# trial_001 (epoch 81: best valid_action_accuracy=0.3399):
#   n_heads=5, n_layers=10, head_dim=128, hidden_size=640
#   lr=9.685e-4, attn_pdrop=0.166, embd_pdrop=0.006, resid_pdrop=0.087
#
# This study searches only the layer_shared_resid_dropout binary pattern:
# whether to tie the attention and MLP residual dropout masks within each layer.
# Four patterns are compared (24-element lists, truncated to n_layers=10 at runtime):
#
#   all-tied   [True]*24  — every layer uses a shared mask
#   none-tied  [False]*24 — large independent masks (baseline)
#   first-only [True] + [False]*23 — only the first layer is tied
#   last-only  [False]*23 + [True] — only the last layer is tied

# This file intended to be run with:
  # rs-hypertune -c results/config/large_emma_23_layer.yaml \
  #     --n-trials 7 --n-epochs 100 --dataset large \
  #     --study-name large-23-layer

context:
  building_blocks: data/large_building_blocks.csv
  random_state: 23
  templates_path: data/large_reaction_templates.pickle
dataset:
  action_dim: 2957
  dataset_name: large
  drop_duplicates: true
  fp_dim: 1024
  n_in_state: 2
  routes_path: data/large_routes.json
  shuffle: true
  synthetic_routes_path: false
  valid_set: n1+n5
evaluation:
  batch_size: 150
  beam_width: 1
  eval_n_batches: 10
  eval_routes_frequency: 150
  max_depth: 6
  sort_on: trajectory_prob
  ted_exhaustive_limit: 64
  test_frac: 0.1
model:
  action_tanh: false
  activation_function: relu
  attn_pdrop: 0.12
  embd_pdrop: 0
  head_dim: 256  # 128
  hidden_size: 1024
  max_ep_len: 31  # 20
  n_heads: 4
  n_layers: 23
  resid_pdrop: 0

optimizer:
  lr: 0.00025
  momentum: 0.9823

optuna:
  n_layers: [19, 27]
  attn_pdrop:
    high: 0.131
    log: true
    low: 0.12
  lr:
    high: 0.003
    log: true
    low: 0.0002
  n_heads: [3, 4, 5]

  # Metric maximised by Optuna across trials:
  #   valid_route_accuracy  — fraction of validation routes where every step matches
  #   valid_action_accuracy — per-step template prediction accuracy on validation set
  #   fraction_solved       — fraction of targets solved during route evaluation
  objective_metric: fraction_solved  # valid_route_accuracy | valid_action_accuracy | fraction_solved
  resid_pdrop:
    high: 0.01
    low: 0.0

reward:
  building_block_reward_factor: 0
  building_block_scale_with_depth: 2
  dead_end_reward_factor: -2
  dead_end_scale_with_depth: 2
  intermediate_reward_factor: -2
  intermediate_scale_with_depth: 1
train:
  batch_size: 128
  early_stopping_patience: 13
  loss: crossEntropyLoss
  lr_scheduler_patience: 4
  lr_scheduler_factor: .71
  n_epochs: 100
  start_epoch: 0
