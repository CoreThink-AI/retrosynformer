context:
  building_blocks: data/large_building_blocks.csv
  random_state: 1
  templates_path: data/large_reaction_templates.pickle
dataset:
  action_dim: 2957
  dataset_name: large
  drop_duplicates: true
  fp_dim: 1024
  n_in_state: 2
  routes_path: data/large_routes.json
  shuffle: true
  synthetic_routes_path: false
  valid_set: n1+n5
evaluation:
  batch_size: 150
  beam_width: 1
  eval_n_batches: 10
  eval_routes_frequency: 150
  max_depth: 6
  sort_on: trajectory_prob
  ted_exhaustive_limit: 64
  test_frac: 0.1
model:
  action_tanh: false
  activation_function: relu
  attn_pdrop: 0.13
  embd_pdrop: 0.01
  head_dim: 256
  hidden_size: 1024
  max_ep_len: 20
  n_heads: 4
  n_layers: 26
  resid_pdrop: 0.023941905940746966
optimizer:
  lr: 0.00025
  momentum: 0.98
optuna:
  n_layers: [24, 26]
  attn_pdrop:
    high: 0.131
    log: true
    low: 0.12
  embd_pdrop:
    high: 0.08
    low: 0.000001
    log: true
  lr:
    high: 0.003
    log: true
    low: 0.0001
  # n_heads:
  # - 2
  # - 3
  # - 4
  # - 5
  # - 6
  # n_layers:
  # - 12
  # - 16
  # - 21
  # - 26
  objective_metric: valid_action_accuracy
  resid_pdrop:
    high: 0.04
    log: true
    low: 0.001
reward:
  building_block_reward_factor: 0
  building_block_scale_with_depth: 2
  dead_end_reward_factor: -2
  dead_end_scale_with_depth: 2
  intermediate_reward_factor: -2
  intermediate_scale_with_depth: 1
train:
  batch_size: 128
  early_stopping_patience: 10
  loss: crossEntropyLoss
  lr_scheduler_patience: 7
  n_epochs: 150
  resume: false
  start_epoch: 0
