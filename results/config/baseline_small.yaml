# Baseline config matching the paper's small-dataset experiment.
#
# Paper: Granqvist et al., RetroSynFormer, Digital Discovery 2026, 5, 348-362
#        DOI: 10.1039/d5dd00153f  (see docs/d5dd00153f-RetroSynFormer.md)
#
# Target result (Table 6, small dataset, beam_width=50):
#   N1 success rate: 0.950   N5 success rate: 0.833
#   N1 top-1 accuracy: 0.182  N5 TED: 5.428
#
# Architecture: GPT-2 Decision Transformer (Section 3.3).
# Hyperparameters were found via Optuna search (paper Table S1).
# The values below reproduce the small-dataset model as closely as possible
# given the published description; n_heads/n_layers/head_dim/lr are taken
# from the Optuna-tuned standard-dataset model (the SI table is not publicly
# available, but these values produced the results in this codebase).
#
# Usage:
#   python -m retrosynformer.runner -c results/config/baseline_small.yaml
#   rs-train -c results/config/baseline_small.yaml

context:
  building_blocks: data/standard_building_blocks.csv
  random_state: 1
  templates_path: data/standard_reaction_templates.pickle

dataset:
  # Small dataset: 588 templates, 53,626 unique targets (paper Table 1)
  action_dim: 588           # small=588, standard=1572, large=2986
  drop_duplicates: true
  fp_dim: 1024              # 1024-bit Morgan radius-2 fingerprints (Section 3.3.2)
  n_in_state: 2             # two molecules concatenated → state_dim = 2048 (Section 3.3.2)
  routes_path: data/standard_routes.json
  shuffle: true
  synthetic_routes_path: false
  # N1+N5 PaRoutes benchmark targets are the held-out test set (Section 3.2)
  valid_set: n1+n5          # random_split | n1+n5

evaluation:
  batch_size: 64
  # beam_width=50 is what the paper calls "RetroSynFormer50" (Section 4)
  # Use beam_width=1 (greedy) for fast sanity checks; 50 for paper-quality results
  beam_width: 50            # 1=greedy, 50=paper default (Fig. 7 shows peak ~width 10 for top-1)
  eval_n_batches: 2
  eval_routes_frequency: 100
  max_depth: 6              # maximum retrosynthesis depth (Section 3.7)
  test_frac: 0.1
  sort_on: trajectory_prob  # trajectory_prob | total_reward
  ted_exhaustive_limit: 64
  # Prune beam branches that would revisit a molecule already decomposed in the same
  # branch (cyclic routes are provably unsolvable and waste beam capacity).
  # Set to false to reproduce pre-v0.1.42 behaviour or to measure the impact.
  prevent_cyclic_routes: true

model:
  action_tanh: false        # discrete one-hot template selection; no tanh needed
  activation_function: relu # Section 3.3; GPT-2 default
  attn_pdrop: 0.0           # paper explored dropout as a hyperparameter; default = 0
  embd_pdrop: 0.0
  head_dim: 256             # from Optuna study (Table S1)
  max_ep_len: 20
  n_heads: 4                # from Optuna study
  n_layers: 26              # from Optuna study
  resid_pdrop: 0.0
  # --- Molecule-conditioned structured dropout ---
  # A learned MLP maps each target molecule's fingerprint to per-channel drop
  # probabilities, then applies inverted Bernoulli masking at the embedding
  # layer output so the same hidden units are suppressed for similar molecules
  # during training.  At eval time the deterministic expected-value mask (1-p)
  # is used instead for stable, reproducible inference.
  # Implemented in src/retrosynformer/structured_dropout.py.
  #
  #   structured_dropout_bottleneck: 128  # MLP hidden dim: fp_dim → bottleneck → hidden_size
  #                                       # fp_dim=1024 → bottleneck (ReLU) → hidden_size (Sigmoid)
  #                                       # typical range 32–512; initial output bias ≈ -2.2 (→ ~10% drop rate)
  #   structured_dropout_rate: 1.0        # global multiplier on learned drop probabilities
  #                                       # 0.0 = no dropout; 1.0 = learned rates unchanged (default)
  #                                       # >1.0 = amplified masking (clamped so drop_prob ≤ 0.9 per channel)
  #                                       # Optuna-searchable via optuna.structured_dropout_rate
  #
  # Example — enable with default settings:
  #   use_structured_dropout: true
  #   structured_dropout_bottleneck: 128
  #   structured_dropout_rate: 1.0
  #
  # Example — strong regularisation (wider bottleneck, amplified rate):
  #   use_structured_dropout: true
  #   structured_dropout_bottleneck: 256
  #   structured_dropout_rate: 1.5
  use_structured_dropout: false  # baseline: no structured dropout

  # --- Residual dropout mask tying (layer_shared_resid_dropout) ---
  # Controls which residual dropout sites share a Bernoulli mask.  Three formats:
  #
  # 1. List of bool / 0-1 (one entry per layer, 0-indexed, length >= n_layers):
  #    Ties the attention and MLP residual dropout masks *within* each enabled
  #    transformer block.  Extra entries beyond n_layers are silently truncated.
  #
  #      layer_shared_resid_dropout: true          # tie all layers uniformly
  #      layer_shared_resid_dropout: [1,1,0,0,...] # per-layer; 1=tied, 0=independent
  #
  # 2. Dict with integer keys (1-based layer number, value bool / 0-1):
  #    Same intra-layer tying but specified as a sparse map instead of a full list.
  #
  #      layer_shared_resid_dropout: {1: 1, 3: 1}  # tie layers 1 and 3 only
  #
  # 3. Dict with float keys of the form N.5 (value = integer group-ID):
  #    Ties the MLP output dropout of 1-based layer N to the attention input
  #    dropout of layer N+1 so the same units are suppressed across the boundary.
  #    Boundaries sharing a group-ID share one mask.
  #
  #      layer_shared_resid_dropout: {1.5: 1}            # one inter-layer tied pair
  #      layer_shared_resid_dropout: {1.5: 1, 2.5: 2}    # two independent pairs
  #      layer_shared_resid_dropout: {1.5: 1, 2.5: 1}    # one mask spans three layers
  #
  # 4. Dict mixing integer and float keys combines both intra- and inter-layer tying:
  #
  #      layer_shared_resid_dropout: {1: 1, 2: 1, 1.5: 1}
  #
  # Implemented in src/retrosynformer/dropout.py:apply_shared_resid_dropout.
  # layer_shared_resid_dropout: ~   # omit or set to null/false to disable

optimizer:
  lr: 0.211                 # from Optuna study (Table S1)
  momentum: 0.98

reward:
  # Default reward function — best overall success rate (paper Table 5)
  # reward = factor * (scale_with_depth^depth)  when scale_with_depth > 0
  #        = factor                              otherwise
  building_block_reward_factor: 0     # building blocks are the goal; neutral reward
  building_block_scale_with_depth: 2  # scale by depth to incentivize shorter routes
  dead_end_reward_factor: -2          # penalize dead ends
  dead_end_scale_with_depth: 2        # harsher penalty at greater depth
  intermediate_reward_factor: -2      # penalize intermediates to favor shorter routes
  intermediate_scale_with_depth: 1    # mild depth scaling for intermediates

train:
  batch_size: 512
  loss: crossEntropyLoss
  n_epochs: 200
  early_stopping_patience: 50  # stop after this many epochs with no valid_loss improvement
  lr_scheduler_patience: 20    # ReduceLROnPlateau patience before halving lr
  results_path: results/
