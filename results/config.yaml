optuna:
  n_heads: [1, 2, 4, 8]
  n_layers: [2, 3, 4, 6, 8, 12, 16, 24, 32]
  head_dim: [64, 128, 256]
  lr:
    low: 1.0e-4
    high: 1.0
    log: true
  dropout:
    low: 0.0
    high: 0.3

context:
  building_blocks: data/standard_building_blocks.csv
  random_state: 1
  templates_path: data/standard_reaction_templates.pickle
dataset:
  action_dim: 589  # large=2957, medium=1573, small=589
  drop_duplicates: true
  fp_dim: 1024
  n_in_state: 2
  routes_path: data/standard_routes.json
  shuffle: true
  synthetic_routes_path: false
  valid_set: n1+n5
evaluation:
  batch_size: 64
  beam_width: 1
  eval_n_batches: 2
  eval_routes_frequency: 100
  max_depth: 6
  test_frac: 0.1
  sort_on: trajectory_prob
  ted_exhaustive_limit: 64
model:
  action_tanh: false
  activation_function: relu
  attn_pdrop: 0.02
  embd_pdrop: 0.2
  head_dim: 256
  max_ep_len: 20
  n_heads: 4
  n_layers: 26
  resid_pdrop: 0.08
optimizer:
  lr: 0.211
  momentum: 0.98
reward:
  building_block_reward_factor: 0
  building_block_scale_with_depth: 2
  dead_end_reward_factor: -2
  dead_end_scale_with_depth: 2
  intermediate_reward_factor: -2
  intermediate_scale_with_depth: 1
train:
  batch_size: 512
  loss: crossEntropyLoss
  n_epochs: 1
  early_stopping_patience: 4  # stop after this many epochs with no valid_loss improvement
  results_path: results/
