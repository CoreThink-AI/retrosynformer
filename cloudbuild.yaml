# Cloud Build CI/CD: build and deploy on push to main.
#
# Set up in Cloud Console → Cloud Build → Triggers:
#   Source: github.com/corethink-ai/retrosynformer, branch: ^main$
#   Config: cloudbuild.yaml (this file)
#   Substitutions: _REGION=us-central1

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - $_IMAGE
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - $_IMAGE
    waitFor:
      - build

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - retrosynformer-inference
      - --image=$_IMAGE
      - --region=$_REGION
      - --gpu=1
      - --gpu-type=nvidia-l4
      - --cpu=8
      - --memory=32Gi
      - --concurrency=4
      - --min-instances=1
      - --max-instances=4
      - --timeout=120
      - --set-env-vars=MODEL_CONFIG_PATH=/app/model/config.yaml,MODEL_WEIGHTS_PATH=/app/model/model.pth,BUILDING_BLOCKS_PATH=/app/data/standard_building_blocks.csv,TEMPLATES_PATH=/app/data/standard_reaction_templates.pickle
      - --set-secrets=API_KEY=retrosynformer-api-key:latest
      - --no-allow-unauthenticated
    waitFor:
      - push

substitutions:
  _IMAGE: gcr.io/$PROJECT_ID/retrosynformer-inference:$SHORT_SHA
  _REGION: us-central1

options:
  machineType: E2_HIGHCPU_8
  substitution_option: ALLOW_LOOSE

timeout: 2400s   # 40 min — large PyTorch base image push can be slow
