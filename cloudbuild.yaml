# Cloud Build CI/CD: build and deploy on push to main.
#
# Set up in Cloud Console → Cloud Build → Triggers:
#   Source: github.com/corethink-ai/retrosynformer, branch: ^main$
#   Config: cloudbuild.yaml (this file)
#   Substitutions: _REGION=us-central1, _GCS_BUCKET=biochem-db-by-hobs, _MODEL_TRIAL=large_nonuniform_trial000

steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - -t
      - $_IMAGE
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - $_IMAGE
    waitFor:
      - build

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - retrosynformer-inference
      - --image=$_IMAGE
      - --region=$_REGION
      - --execution-environment=gen2
      - --gpu=1
      - --gpu-type=nvidia-l4
      - --no-gpu-zonal-redundancy
      - --cpu=8
      - --memory=32Gi
      - --concurrency=4
      - --min-instances=1
      - --max-instances=1
      - --timeout=120
      - --update-annotations=autoscaling.knative.dev/maxScale=1,run.googleapis.com/maxScale=1
      - --update-env-vars=MODEL_WEIGHTS_GCS=gs://$_GCS_BUCKET/retrosynformer/models/$_MODEL_TRIAL/model.pth,MODEL_CONFIG_GCS=gs://$_GCS_BUCKET/retrosynformer/models/$_MODEL_TRIAL/config.yaml,BUILDING_BLOCKS_GCS=gs://$_GCS_BUCKET/retrosynformer/data/$_DATASET_BUILDING_BLOCKS,TEMPLATES_GCS=gs://$_GCS_BUCKET/retrosynformer/data/$_DATASET_TEMPLATES,MODEL_WEIGHTS_PATH=/tmp/model/model.pth,MODEL_CONFIG_PATH=/tmp/model/config.yaml,BUILDING_BLOCKS_PATH=/tmp/data/$_DATASET_BUILDING_BLOCKS,TEMPLATES_PATH=/tmp/data/$_DATASET_TEMPLATES
    waitFor:
      - push

substitutions:
  _TAG: latest
  _IMAGE: gcr.io/$PROJECT_ID/retrosynformer-inference:$_TAG
  _REGION: us-central1
  _GCS_BUCKET: biochem-db-by-hobs
  _MODEL_TRIAL: large_nonuniform_trial000
  _DATASET_BUILDING_BLOCKS: large_building_blocks.csv
  _DATASET_TEMPLATES: large_reaction_templates.pickle

options:
  machineType: E2_HIGHCPU_8
  substitution_option: ALLOW_LOOSE

timeout: 2400s   # 40 min — large PyTorch base image push can be slow
